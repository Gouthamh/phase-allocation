name: busbar

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      busbar-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health" ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - application

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - application

  busbar-api:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - application

networks:
  application:
    driver: bridge
