name: Phase allocation tests

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [main, develop, 'release/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [smoke, regression]
        default: regression

permissions:
  contents: read
  packages: write

concurrency:
  group: phase-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: UI and API quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: busbar
    env:
      CI: 'true'
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: busbar/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            busbar/backend/requirements.txt
            busbar/backend/requirements-dev.txt
      - name: Choose suite
        id: suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          suite=regression
          if [ "$EVENT_NAME" = "pull_request" ]; then
            suite=smoke
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            suite="$REQUESTED_SUITE"
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
      - name: Restore test dependencies
        run: npm ci
      - name: Install Playwright browsers
        env:
          SUITE: ${{ steps.suite.outputs.suite }}
        run: |
          if [ "$SUITE" = "smoke" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium firefox webkit
          fi
      - name: Lint, type-check, and validate test discovery
        run: npm run validate
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run backend unit and contract tests
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pytest backend/tests -q
      - name: Build and start application
        id: application
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify container hardening
        shell: pwsh
        run: ./deploy/security-test.ps1
      - name: Run UI and API tests
        env:
          SUITE: ${{ steps.suite.outputs.suite }}
        run: |
          if [ "$SUITE" = "smoke" ]; then
            npm run test:smoke
          else
            npm run test:regression
          fi
      - name: Publish tested Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$OWNER" --password-stdin
          owner_lower="${OWNER,,}"
          docker tag busbar-frontend:latest \
            "ghcr.io/$owner_lower/busbar-frontend:sha-$COMMIT_SHA"
          docker tag busbar-busbar-api:latest \
            "ghcr.io/$owner_lower/busbar-api:sha-$COMMIT_SHA"
          docker push "ghcr.io/$owner_lower/busbar-frontend:sha-$COMMIT_SHA"
          docker push "ghcr.io/$owner_lower/busbar-api:sha-$COMMIT_SHA"
      - name: Capture application logs
        if: ${{ always() && steps.application.outcome != 'skipped' }}
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/docker.log 2>&1
          docker compose ps --all > test-results/containers.txt
      - name: Upload HTML report and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-tests-${{ steps.suite.outputs.suite || 'setup' }}-${{ github.run_attempt }}
          path: |
            busbar/playwright-report/
            busbar/test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop application
        if: ${{ always() && steps.application.outcome != 'skipped' }}
        run: docker compose down
